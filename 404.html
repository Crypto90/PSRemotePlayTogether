<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>ControlTogether</title>
<meta name="description" content="Your friend shares their game: open the link, plug in a controller and play along. Same picture, same sound, nothing to install.">
<!-- What a chat app shows for a link here (it runs no script, so it never follows the forward below): the page's own preview -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="ControlTogether">
<meta property="og:title" content="Play together from your browser">
<meta property="og:description" content="Your friend shares their game: open the link, plug in a controller and play along. Same picture, same sound, nothing to install.">
<meta property="og:url" content="https://play.controltogether.com/">
<meta property="og:image" content="https://play.controltogether.com/img/og.png">
<meta property="og:image:type" content="image/png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="ControlTogether: play together from your browser. Same picture, same sound, your own controller.">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Play together from your browser">
<meta name="twitter:description" content="Your friend shares their game: open the link, plug in a controller and play along. Same picture, same sound, nothing to install.">
<meta name="twitter:image" content="https://play.controltogether.com/img/og.png">
<script>
  // Any address of the old page (a room link "/PSRemotePlayTogether/r/<name>" too) on the page's
  // new address, with its query and the part after "#"
  location.replace('https://play.controltogether.com/' + location.pathname.replace(/^\/PSRemotePlayTogether\/?/, '') + location.search + location.hash);
</script>
</head>
<body>
<p>PSRemotePlayTogether is now ControlTogether. <a href="https://play.controltogether.com/">Open the page</a>.</p>
</body>
</html>
